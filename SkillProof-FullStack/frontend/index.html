<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillProof — Skill Verification Platform</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#667085;--line:#e5e7eb;--blue:#2563eb;--blue2:#eff6ff;--green:#16a34a;--amber:#d97706;--dark:#0f172a;--shadow:0 10px 30px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef4ff,#f8fafc)}
.authbox{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:var(--shadow)}
.logo{font-weight:900;font-size:25px;letter-spacing:-1px}.logo span{color:var(--blue)}
.auth h1{font-size:30px;margin:30px 0 8px}.muted{color:var(--muted)}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none}.field textarea{min-height:110px;resize:vertical}
.primary,.secondary,.google{width:100%;border:0;border-radius:10px;padding:12px 16px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.google{background:#fff;border:1px solid var(--line);margin:10px 0}.divider{display:flex;align-items:center;gap:10px;color:#98a2b3;font-size:12px;margin:16px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}
.app{min-height:100vh}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.user{display:flex;align-items:center;gap:12px;font-weight:700}.topbrand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:-.4px;color:#102a68}.topbrand svg{width:34px;height:34px;display:block}.topbrand span{font-size:16px}.avatar{width:34px;height:34px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center}
.layout{display:flex}.side{width:230px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 66px);padding:18px 12px;position:fixed}.nav{display:grid;gap:5px}.nav button{background:transparent;border:0;text-align:left;padding:12px;border-radius:10px;color:#475467;font-weight:700}.nav button.active,.nav button:hover{background:var(--blue2);color:var(--blue)}.main{margin-left:230px;width:calc(100% - 230px);padding:28px;max-width:1500px}.back{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:9px;font-weight:700;margin-bottom:16px}
h1{font-size:28px;margin:0 0 6px}h2{font-size:19px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 3px 12px rgba(15,23,42,.03)}.stat{font-size:28px;font-weight:900;margin-top:5px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#f2f4f7;color:#475467;font-size:11px;font-weight:800;margin:3px}.tag.blue{background:#eff6ff;color:#1d4ed8}.tag.green{background:#ecfdf3;color:#15803d}.task{display:flex;flex-direction:column;min-height:230px}.task .grow{flex:1}.task h3{margin:10px 0 7px}.task p{font-size:13px;color:var(--muted);line-height:1.5}.btnrow{display:flex;gap:8px}.btnrow button{flex:1}.small{font-size:12px}.progress{height:8px;background:#edf0f4;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:10px}.workspace{display:grid;grid-template-columns:270px minmax(0,1fr) 320px;gap:14px}.workarea{min-height:540px}.workhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.autosave{font-size:12px;color:var(--green);font-weight:800}.editor{width:100%;min-height:260px;background:#0b1220;color:#e5e7eb;border:0;border-radius:12px;padding:16px;font-family:ui-monospace,monospace;line-height:1.5}.output{background:#0b1220;color:#cbd5e1;border-radius:12px;padding:15px;min-height:100px;margin-top:12px;white-space:pre-wrap;font-family:ui-monospace,monospace}.mentor{height:100%;display:flex;flex-direction:column}.chat{flex:1;min-height:270px;max-height:390px;overflow:auto;background:#f8fafc;border-radius:12px;padding:12px}.msg{padding:10px 12px;border-radius:12px;margin:8px 0;font-size:13px;line-height:1.45}.ai{background:#fff;border:1px solid var(--line)}.me{background:#dbeafe;margin-left:30px}.chatinput{display:flex;gap:7px;margin-top:9px}.chatinput input{flex:1;padding:10px;border:1px solid var(--line);border-radius:9px}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.modalbg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:18px;width:min(650px,100%);max-height:90vh;overflow:auto;padding:24px}.close{float:right;border:0;background:#f2f4f7;border-radius:8px;padding:6px 9px}.notice{padding:12px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);font-size:13px}.evalrow{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.good{color:var(--green);font-weight:800}.warn{color:var(--amber);font-weight:800}
@media(max-width:1050px){.workspace{grid-template-columns:1fr}.side{width:76px}.side .nav button{font-size:0;text-align:center}.side .nav button:before{content:"•";font-size:20px}.main{margin-left:76px;width:calc(100% - 76px)}.cards{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.top{padding:0 12px}.main{padding:18px;margin-left:0;width:100%}.side{display:none}.cards,.stats,.split{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.top .user span{display:none}}
</style>
</head>
<body>

<section id="auth" class="auth">
  <div class="authbox">
    <div class="logo">Skill<span>Proof</span></div>
    <div id="signinBox">
      <h1>Welcome back</h1><p class="muted">Prove your skills through actual work.</p>
      <button class="google" onclick="googleLogin()">Continue with Google</button>
      <div class="divider">OR</div>
      <div class="field"><label>Email</label><input id="loginEmail" placeholder="you@gmail.com"></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" placeholder="••••••••"></div>
      <button class="primary" onclick="demoLogin()">Sign In</button>
      <p class="small muted">New here? <a href="#" onclick="toggleAuth();return false">Create an account</a></p>
    </div>
    <div id="signupBox" class="hidden">
      <h1>Create account</h1><p class="muted">Start building evidence of your skills.</p>
      <div class="field"><label>Full name</label><input id="signupName" placeholder="Abdul Baseeth A"></div>
      <div class="field"><label>Email</label><input id="signupEmail" type="email" placeholder="you@gmail.com"></div>
      <div class="field"><label>Password</label><input id="signupPassword" type="password" placeholder="••••••••"></div>
      <button class="primary" onclick="createAccount()">Create Account</button>
      <p class="small muted">Already have an account? <a href="#" onclick="toggleAuth();return false">Sign in</a></p>
    </div>
  </div>
</section>

<section id="app" class="app hidden">
<header class="top">
  <div class="logo">Skill<span>Proof</span></div>
  <div class="user"><div class="topbrand" aria-label="SkillProof logo">
    <svg viewBox="0 0 44 44" role="img" aria-hidden="true">
      <defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs>
      <path d="M22 2.5 39 9v11.8c0 10.1-6.8 17.2-17 20.7C12.8 38 6 30.9 6 20.8V9l16-6.5Z" fill="url(#spg)"/>
      <path d="M22 8.5 32.5 12v8.3c0 6.2-3.9 10.9-10.5 13.5-6.6-2.6-10.5-7.3-10.5-13.5V12L22 8.5Z" fill="#fff" opacity=".96"/>
      <path d="M15.2 21.7c1.6-3.2 4.2-4.9 7.7-4.9 2.6 0 4.6.8 6.2 2.4M28.8 22.3c-1.6 3.2-4.2 4.9-7.7 4.9-2.6 0-4.6-.8-6.2-2.4" fill="none" stroke="url(#spg)" stroke-width="2.7" stroke-linecap="round"/>
      <path d="m18.5 22 2.5 2.5 4.8-5.2" fill="none" stroke="#2563eb" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg><span>SkillProof</span>
  </div><button class="secondary" style="width:auto;padding:7px 10px" onclick="logout()">Logout</button></div>
</header>
<div class="layout">
<aside class="side">
  <nav class="nav">
    <button class="active" onclick="page('dashboard',this)">🏠 Dashboard</button>
    <button onclick="page('tasks',this)">📚 Tasks</button>
    <button onclick="page('proof',this)">📁 My Proof</button>
    <button onclick="page('skills',this)">📈 Skills</button>
    <button onclick="page('activity',this)">🕘 Activity</button>
    <button onclick="page('profile',this)">👤 Profile</button>
  </nav>
</aside>
<main id="main" class="main"></main>
</div>
</section>

<div id="modal" class="modalbg hidden"><div class="modal" id="modalBody"></div></div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js"></script>
<script>
const tasks=[
{id:1,course:"B.Sc Data Science",subject:"Python",skill:"Data Cleaning",title:"Student Data Cleaner",type:"Python Coding",difficulty:"Intermediate",time:"45 min",desc:"Clean a messy student dataset, identify quality issues and prepare it for analysis."},
{id:2,course:"B.Sc Data Science",subject:"Power BI",skill:"Data Visualization",title:"Sales Insight Dashboard",type:"Dashboard",difficulty:"Intermediate",time:"60 min",desc:"Build a dashboard that reveals useful sales patterns and business insights."},
{id:3,course:"B.Sc Data Science",subject:"Excel",skill:"Business Analysis",title:"Budget Investigation",type:"Spreadsheet",difficulty:"Beginner",time:"30 min",desc:"Compare planned and actual spending and explain the largest variances."},
{id:4,course:"B.Sc Physics",subject:"Mechanics",skill:"Experimental Physics",title:"Projectile Motion Investigation",type:"Physics Lab",difficulty:"Intermediate",time:"45 min",desc:"Use experimental observations to investigate projectile motion and compare results."},
{id:5,course:"B.Sc Physics",subject:"Electronics",skill:"Circuit Analysis",title:"RC Circuit Investigation",type:"Physics Lab",difficulty:"Intermediate",time:"50 min",desc:"Analyse an RC circuit using observations, calculations and a graph."},
{id:6,course:"B.Sc Chemistry",subject:"Analytical Chemistry",skill:"Lab Analysis",title:"Titration Result Analysis",type:"Lab Analysis",difficulty:"Intermediate",time:"40 min",desc:"Analyse titration readings, calculate the result and explain experimental uncertainty."},
{id:7,course:"B.Com",subject:"Accounting",skill:"Reconciliation",title:"Bank Reconciliation Investigation",type:"Accounting Workspace",difficulty:"Intermediate",time:"35 min",desc:"Investigate differences between the cash book and bank statement."},
{id:8,course:"BBA",subject:"Marketing",skill:"Business Analysis",title:"Customer Survey Investigation",type:"Business Analysis",difficulty:"Beginner",time:"35 min",desc:"Turn customer survey evidence into a clear business recommendation."},
{id:9,course:"B.Sc Mathematics",subject:"Statistics",skill:"Data Analysis",title:"Survey Data Analysis",type:"Statistics",difficulty:"Intermediate",time:"40 min",desc:"Choose an appropriate statistical method and interpret the result."},
{id:10,course:"BCA",subject:"Java",skill:"Programming",title:"Student Management System",type:"Java Coding",difficulty:"Intermediate",time:"60 min",desc:"Build core functionality for a simple student management system."},
{id:11,course:"BCA",subject:"SQL",skill:"Database Querying",title:"Library Database Investigation",type:"SQL Workspace",difficulty:"Intermediate",time:"45 min",desc:"Query a library database to answer real operational questions."},
{id:12,course:"B.Des",subject:"Design",skill:"Product Design",title:"Product Design Brief",type:"Design Studio",difficulty:"Beginner",time:"45 min",desc:"Create a product concept from a real user problem and justify your design decisions."}
];
let currentTask=null,currentPage="dashboard",timer=null,currentUser=null;
const blankState=()=>({saved:{},versions:{},runs:{},evaluations:{},understanding:{},skills:{},activity:[],profile:{name:"",email:"",course:"",department:"",bio:""}});
let state=blankState();

function validEmail(email){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);}
function userKey(email){return "skillproof_user_"+email.trim().toLowerCase();}
function loadUser(email){
 currentUser=email.trim().toLowerCase();
 const raw=localStorage.getItem(userKey(currentUser));
 state=raw?JSON.parse(raw):blankState();
 state.saved=state.saved||{};state.versions=state.versions||{};state.runs=state.runs||{};state.evaluations=state.evaluations||{};state.understanding=state.understanding||{};state.skills=state.skills||{};state.activity=state.activity||[];
 state.profile=state.profile||{name:currentUser.split("@")[0],email:currentUser,course:"B.Sc Data Science",department:"Data Science",bio:""};
 if(!state.profile.email)state.profile.email=currentUser;
 if(!state.activity.length)state.activity=["Signed in"];saveState();
}
function enterApp(){
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 page("dashboard");
}
function googleLogin(){
 // Demo-safe Google flow: no fake/default account. A real deployment should replace this with Firebase/Google OAuth.
 const email=prompt("Demo Google Sign-In\nEnter the Google account email you want to use:");
 if(email===null)return;
 const clean=email.trim().toLowerCase();
 if(!validEmail(clean)){alert("Please enter a valid Google account email.");return;}
 let raw=localStorage.getItem(userKey(clean));
 if(!raw){
   state=blankState();
   state.profile={name:clean.split("@")[0],email:clean,course:"B.Sc Data Science"};
   state.authProvider="google-demo";
   currentUser=clean;
   saveState();
 }else{
   loadUser(clean);
 }
 enterApp();
}
function saveState(){if(currentUser)localStorage.setItem(userKey(currentUser),JSON.stringify(state));}
function demoLogin(){
 const email=document.getElementById("loginEmail").value.trim().toLowerCase();
 const password=document.getElementById("loginPassword").value;
 if(!validEmail(email)){alert("Please enter a valid email address.");return;}
 if(!password){alert("Please enter your password.");return;}
 const raw=localStorage.getItem(userKey(email));
 if(!raw){alert("No account found for this email. Please create an account first.");return;}
 const parsed=JSON.parse(raw);
 if(parsed.__password !== password){alert("Incorrect password. Please check the password you used when creating the account.");return;}
 loadUser(email);
 enterApp();
}
function createAccount(){
 const name=document.getElementById("signupName").value.trim();
 const email=document.getElementById("signupEmail").value.trim().toLowerCase();
 const password=document.getElementById("signupPassword").value;
 if(!name){alert("Please enter your full name.");return;}
 if(!validEmail(email)){alert("Please enter a valid email address.");return;}
 if(password.length<6){alert("Password must be at least 6 characters.");return;}
 if(localStorage.getItem(userKey(email))){
   alert("An account with this email already exists. Please sign in.");
   document.getElementById("loginEmail").value=email;
   toggleAuth();
   return;
 }
 state=blankState();
 state.profile={name,email,course:"B.Sc Data Science"};
 state.__password=password;
 state.authProvider="email";
 currentUser=email;
 saveState();
 // Immediately enter the newly-created account. The password remains stored for this local demo so the next login also works.
 document.getElementById("signupName").value="";
 document.getElementById("signupEmail").value="";
 document.getElementById("signupPassword").value="";
 enterApp();
}
function logout(){if(currentTask)autoSave();saveState();currentUser=null;state=blankState();currentTask=null;document.getElementById("app").classList.add("hidden");document.getElementById("auth").classList.remove("hidden");document.getElementById("loginPassword").value="";}
function toggleAuth(){document.getElementById("signinBox").classList.toggle("hidden");document.getElementById("signupBox").classList.toggle("hidden")}
function page(name,el){
 currentPage=name;if(el){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));el.classList.add("active")}
 const m=document.getElementById("main");window.scrollTo(0,0);
 if(name==="dashboard")m.innerHTML=dashboard();
 if(name==="tasks")m.innerHTML=tasksPage();
 if(name==="proof")m.innerHTML=proofPage();
 if(name==="skills")m.innerHTML=skillsPage();
 if(name==="activity")m.innerHTML=activityPage();
 if(name==="profile")m.innerHTML=profilePage();
}
function dashboard(){
 const ids=Object.keys(state.evaluations||{});const completed=ids.filter(id=>state.understanding[id]);const map={};ids.forEach(id=>{const t=tasks.find(x=>x.id==id);if(t){map[t.skill]=map[t.skill]||[];map[t.skill].push(state.evaluations[id].score||0);}});const skills=Object.keys(map).length;const overall=ids.length?Math.round(ids.reduce((a,id)=>a+(state.evaluations[id].score||0),0)/ids.length):0;const name=(state.profile&&state.profile.name)||"Student";
 return `<div><p class="muted small">Welcome, ${escapeHtml(name)} 👋</p><h1>Dashboard</h1><p class="muted">Build evidence of what you can actually demonstrate.</p><div class="grid stats" style="margin:22px 0">${stat("Skills Demonstrated",skills,"Evaluated skills")}${stat("Tasks Completed",completed.length,"With understanding checks")}${stat("Proof Records",ids.length,"Evidence-backed")}${stat("Overall Progress",overall+"%",ids.length?"Average evaluation":"No evaluations yet")}</div><h2>Recommended tasks</h2><div class="grid cards">${tasks.slice(0,3).map(taskCard).join("")}</div><div class="grid split" style="margin-top:18px"><div class="card"><h2>Recent activity</h2>${(state.activity||[]).slice(0,4).map(x=>`<div class="notice" style="margin:7px 0">✓ ${escapeHtml(x)}</div>`).join("")||'<p class="muted">No activity yet.</p>'}</div><div class="card"><h2>Skill progress</h2>${Object.entries(map).slice(0,4).map(([k,v])=>skillBar(k,Math.round(v.reduce((a,b)=>a+b,0)/v.length))).join("")||'<p class="muted">Complete a task to see progress.</p>'}</div></div></div>`;
}
function stat(a,b,c){return `<div class="card"><div class="muted small">${a}</div><div class="stat">${b}</div><div class="muted small">${c}</div></div>`}
function taskCard(t){return `<div class="card task"><div><span class="tag blue">${t.course}</span><span class="tag">${t.type}</span><h3>${t.title}</h3><p>${t.desc}</p><span class="tag">${t.difficulty}</span><span class="tag">${t.time}</span></div><div class="btnrow"><button class="primary" onclick="openTask(${t.id})">Open Workroom</button></div></div>`}
function tasksPage(){return `<button class="back" onclick="historyBack()">← Back</button><h1>Task Library</h1><p class="muted">Choose a real-world task. Your workspace adapts to the skill.</p><div class="field" style="max-width:480px"><input id="search" placeholder="Search tasks, skills or subjects..." oninput="filterTasks()"></div><div id="taskGrid" class="grid cards">${tasks.map(taskCard).join("")}</div>`}
function filterTasks(){let q=document.getElementById("search").value.toLowerCase();document.getElementById("taskGrid").innerHTML=tasks.filter(t=>Object.values(t).some(v=>String(v).toLowerCase().includes(q))).map(taskCard).join("")}
function openTask(id){currentTask=tasks.find(t=>t.id===id);renderWorkspace();history.pushState({work:true},"","#workroom");}
function historyBack(){if(currentPage!=="dashboard")page("dashboard");else window.history.back()}
window.onpopstate=()=>{if(currentPage!=="dashboard")page("dashboard");else page("tasks")}
function renderWorkspace(){
 const t=currentTask,m=document.getElementById("main");m.innerHTML=`<button class="back" onclick="historyBack()">← Back to Tasks</button><div class="workhead"><div><span class="tag blue">${escapeHtml(t.course)}</span><span class="tag">${escapeHtml(t.subject)}</span><h1>${escapeHtml(t.title)}</h1><p class="muted">${escapeHtml(t.desc)}</p></div><span class="autosave" id="saveState">● Ready</span></div><div class="workspace"><div class="card"><h2>Task Brief</h2><p class="small">${escapeHtml(t.desc)}</p><div class="notice"><b>Skill:</b> ${escapeHtml(t.skill)}<br><b>Workspace:</b> ${escapeHtml(t.type)}<br><b>Time:</b> ${escapeHtml(t.time)}</div><h3>Requirements</h3><ul class="small"><li>Show your reasoning</li><li>Use evidence from your work</li><li>Be ready to explain your decisions</li></ul><button class="secondary" onclick="showVersions()">↔ View Versions</button></div><div class="card workarea">${workspace(t)}<div class="btnrow" style="margin-top:12px"><button class="secondary" id="runBtn" onclick="runWork()">▶ Run / Preview</button><button class="primary" id="evalBtn" onclick="submitEval()">Submit for AI Evaluation</button></div></div><div class="card mentor"><h2>🤖 SkillGuide</h2><p class="small muted">I guide your thinking — I don't do the task for you.</p><div id="chat" class="chat"><div class="msg ai">Tell me what you're stuck on, what you tried, or what you want to understand.</div></div><div class="chatinput"><input id="chatq" placeholder="Ask SkillGuide..." onkeydown="if(event.key==='Enter')askGuide()"><button class="primary" style="width:auto" onclick="askGuide()">Send</button></div></div></div>`;m.querySelectorAll(".workarea textarea, .workarea input, .workarea select").forEach(el=>el.addEventListener("input",autoSave));restoreWork(t);
}
function collectWork(){const area=document.querySelector(".workarea");if(!area)return "";return Array.from(area.querySelectorAll("textarea,input,select")).map(el=>(el.value||"").trim()).filter(Boolean).join("\n").trim();}
function restoreWork(t){const saved=state.saved[t.id];if(!saved)return;const fields=(typeof saved==="string")?{workInput:saved}:(saved.fields||{});document.querySelectorAll(".workarea textarea,.workarea input,.workarea select").forEach((el,i)=>{const key=el.id||("field"+i);if(fields[key]!==undefined)el.value=fields[key];});const el=document.getElementById("saveState");if(el)el.textContent="● Restored saved work";}
function workspace(t){if(t.type.includes("Coding")||t.type==="SQL Workspace")return `<label class="small"><b>${t.type==="SQL Workspace"?"SQL Query":"Code Work Area"}</b></label><textarea id="workInput" class="editor" placeholder="Write your solution here..."></textarea><div class="output" id="output">Output will appear here after Run / Preview.</div>`;if(t.type==="Physics Lab")return `<div class="split"><div><b>Experimental Observations</b><textarea id="observations" class="field" style="min-height:210px" placeholder="Enter observations and measurements..."></textarea></div><div><b>Graph / Result</b><div class="notice" id="graphPreview" style="height:210px;display:grid;place-items:center">📈 Graph preview area</div></div></div><div class="field"><label>Calculations & reasoning</label><textarea id="reasoning" class="field" style="min-height:140px" placeholder="Show calculations and explain your reasoning..."></textarea>`;if(t.type==="Lab Analysis")return `<label>Observations & analysis</label><textarea id="workInput" class="field" style="min-height:300px" placeholder="Record observations, analysis and conclusion..."></textarea><div class="output" id="output">Analysis preview will appear here.</div>`;if(t.type==="Dashboard")return `<div class="notice"><b>Dataset:</b> Sales_Q1.csv — sample dataset loaded</div><div class="split" style="margin-top:12px"><textarea id="workInput" class="field" placeholder="Dashboard plan, measures, filters and insights..."></textarea><div class="notice" id="dashboardPreview">📊 Dashboard canvas<br><br>Run / Preview to validate your plan.</div></div>`;if(t.type==="Spreadsheet"||t.type==="Accounting Workspace")return `<table class="table"><tr><th>Category</th><th>Planned</th><th>Actual</th><th>Variance</th></tr><tr><td>Operations</td><td>₹40,000</td><td>₹46,000</td><td>+₹6,000</td></tr><tr><td>Marketing</td><td>₹25,000</td><td>₹21,000</td><td>-₹4,000</td></tr><tr><td>Travel</td><td>₹15,000</td><td>₹19,000</td><td>+₹4,000</td></tr></table><textarea id="workInput" class="field" placeholder="Investigate the largest variances and explain your conclusion..."></textarea><div class="output" id="output">Preview will appear here.</div>`;if(t.type==="Statistics")return `<div class="notice">Dataset: 12 survey observations loaded.</div><textarea id="workInput" class="field" style="min-height:300px" placeholder="Choose method → calculate → interpret..."></textarea><div class="output" id="output">Statistical preview will appear here.</div>`;if(t.type==="Design Studio")return `<div class="notice">Design brief: Identify the user problem, propose a concept and justify the design decisions.</div><textarea id="workInput" class="field" style="min-height:300px" placeholder="Concept, user need, design decisions, rationale..."></textarea><div class="output" id="output">Design review preview will appear here.</div>`;return `<textarea id="workInput" class="field" style="min-height:330px"></textarea><div class="output" id="output">Preview will appear here.</div>`}
function autoSave(){clearTimeout(timer);if(!currentTask||!currentUser)return;const el=document.getElementById("saveState");if(el)el.textContent="● Saving...";const fields={};document.querySelectorAll(".workarea textarea,.workarea input,.workarea select").forEach((x,i)=>fields[x.id||("field"+i)]=x.value||"");const work=Object.values(fields).join("\n").trim();state.saved[currentTask.id]={fields,updatedAt:new Date().toISOString()};if(work){const arr=state.versions[currentTask.id]||[];const last=arr[arr.length-1];if(!last||last.snapshot!==work){arr.push({snapshot:work,savedAt:new Date().toISOString()});state.versions[currentTask.id]=arr.slice(-10);}}saveState();if(el)el.textContent=work?"● Auto-saved just now":"● Nothing to save yet";timer=setTimeout(()=>{const e=document.getElementById("saveState");if(e&&currentTask&&currentUser)e.textContent=work?"● Auto-saved just now":"● Nothing to save yet";},400);}
function hasRealWork(){return collectWork().replace(/[\s#\/_*\-]/g,"").length>=8;}
let pyodideInstance=null,pyodideLoading=null;async function getPyodide(){if(pyodideInstance)return pyodideInstance;if(pyodideLoading)return pyodideLoading;if(typeof loadPyodide!=="function")throw new Error("Python runtime could not be loaded. Reload with internet access enabled.");pyodideLoading=(async()=>{const p=await loadPyodide();await p.loadPackage(["pandas","matplotlib"]);return p;})();pyodideInstance=await pyodideLoading;return pyodideInstance;}const demoCSV=`Student_ID,Gender,Attendance,Study_Hours,Assignments_Score,Internal_Marks,Final_Marks
1,Male,92,5,82,78,80
2,Female,88,4,79,76,77
3,Male,95,7,91,88,90
4,Female,85,3,72,70,71
5,Male,90,6,86,84,85
6,Female,93,8,94,91,93
7,Male,80,2,65,62,64
8,Female,97,9,96,94,96
9,Male,89,5,81,79,82
10,Female,91,6,88,85,87
11,Male,84,4,75,73,74
12,Female,96,7,92,89,91
13,Male,87,3,70,68,69
14,Female,94,8,95,92,94
15,Male,90,6,89,86,88`;async function runPython(){const code=document.getElementById("workInput")?.value.trim();const out=document.getElementById("output");if(!code){alert("Write some Python code first.");return false;}const btn=document.getElementById("runBtn");if(btn){btn.disabled=true;btn.textContent="Running Python...";}try{const py=await getPyodide();py.FS.writeFile("student_performance.csv",demoCSV);const lines=code.split("\n").map(x=>"    "+x).join("\n");const wrapper=`import io,contextlib,traceback
_stdout=io.StringIO()
_stderr=io.StringIO()
with contextlib.redirect_stdout(_stdout), contextlib.redirect_stderr(_stderr):
 try:
${lines}
 except Exception:
  traceback.print_exc()
print(_stdout.getvalue())
print(_stderr.getvalue())`;const result=await py.runPythonAsync(wrapper);const text=String(result||"").trim();const err=text.includes("Traceback")||/\b[A-Za-z]+Error:/.test(text);state.runs[currentTask.id]={success:!err,output:text,ranAt:new Date().toISOString()};saveState();if(out){out.textContent=(text||"Code executed successfully with no printed output.")+"\n\n"+(err?"Execution failed — fix the error before submitting.":"Execution successful — review your output before submitting.");if(!err){try{const png=py.FS.readFile("study_hours_vs_final_marks.png");let bin="";for(let i=0;i<png.length;i++)bin+=String.fromCharCode(png[i]);out.innerHTML=escapeHtml(out.textContent)+`<br><br><b>Generated chart:</b><br><img src="data:image/png;base64,${btoa(bin)}" style="max-width:100%;border-radius:10px;background:#fff;padding:8px">`; }catch(_){}}}return !err;}catch(err){state.runs[currentTask.id]={success:false,output:String(err.message||err),ranAt:new Date().toISOString()};saveState();if(out)out.textContent="Runtime error: "+(err.message||err);return false;}finally{if(btn){btn.disabled=false;btn.textContent="▶ Run / Preview";}}}async function runWork(){if(!currentTask){alert("Select a task first.");return;}if(!hasRealWork()){alert("Nothing to run yet. Complete some work in the workspace first.");return;}autoSave();if(currentTask.type==="Python Coding"){await runPython();return;}const out=document.getElementById("output");let msg="";if(currentTask.type==="SQL Workspace")msg="SQL preview complete. Check SELECT/FROM/WHERE/JOIN/GROUP BY logic and whether the result answers the task.";else if(currentTask.type.includes("Coding"))msg="Code preview complete. Check syntax, logic, input handling and expected output.";else if(currentTask.type==="Physics Lab")msg="Physics preview complete. Check units, calculations, graph trend and comparison with expected behaviour.";else if(currentTask.type==="Lab Analysis")msg="Lab analysis preview complete. Check observations, method, calculation and conclusion.";else if(currentTask.type==="Dashboard")msg="Dashboard preview complete. Check that each visual answers a business question and uses an appropriate measure.";else if(currentTask.type==="Statistics")msg="Statistics preview complete. Check method selection, calculation and interpretation.";else if(currentTask.type==="Spreadsheet"||currentTask.type==="Accounting Workspace")msg="Spreadsheet/accounting preview complete. Check variance calculation and evidence for your conclusion.";else if(currentTask.type==="Design Studio")msg="Design review preview complete. Check user problem, concept, rationale and constraints.";else msg="Work preview complete. Review your reasoning before submitting.";state.runs[currentTask.id]={success:true,output:msg,ranAt:new Date().toISOString()};saveState();if(out)out.textContent=msg;const gp=document.getElementById("graphPreview");if(gp)gp.innerHTML="📈 Graph/result area ready for your observations and calculations.";}function scoreEvaluation(t,work,run){const text=work.toLowerCase();let score=45;if(work.length>80)score+=10;if(work.length>180)score+=8;if(work.length>350)score+=5;const ks={"Python Coding":["pandas","read_csv","missing","mean","corr","plot","savefig"],"SQL Workspace":["select","from","where","group by","order by"],"Java Coding":["class","public","static","void","student"],"Statistics":["mean","median","correlation","interpret","sample"],"Spreadsheet":["variance","planned","actual","conclusion"],"Accounting Workspace":["reconciliation","balance","difference","bank","book"],"Physics Lab":["observation","calculation","unit","graph","result"],"Lab Analysis":["observation","analysis","calculation","conclusion"],"Dashboard":["visual","filter","measure","insight","dashboard"],"Business Analysis":["customer","evidence","insight","recommendation"],"Design Studio":["user","problem","concept","design","rationale"]}[t.type]||[];if(ks.length)score+=Math.round(25*ks.filter(k=>text.includes(k)).length/ks.length);if(run?.success)score+=15;else if(t.type.includes("Coding")||t.type==="SQL Workspace")score-=10;score=Math.max(40,Math.min(98,score));return{correct:score>=78?"Strong":score>=62?"Developing":"Needs Improvement",approach:score>=72?"Good":"Needs Improvement",problem:score>=80?"Strong":score>=60?"Developing":"Needs Improvement",completion:score>=65?"Ready":"Incomplete",score,workSnapshot:work,runSnapshot:run||null,evaluatedAt:new Date().toISOString()};}function submitEval(){if(!currentTask){alert("Please select a task first.");return;}if(!hasRealWork()){alert("You cannot submit an empty workroom. Complete the task first.");return;}const executable=currentTask.type.includes("Coding")||currentTask.type==="SQL Workspace";const run=state.runs[currentTask.id];if(executable&&!run?.success){alert("Run / Preview must finish successfully before submitting this task for evaluation.");return;}const work=collectWork();autoSave();const b=document.getElementById("evalBtn");if(b){b.disabled=true;b.textContent="Evaluating...";}setTimeout(()=>{try{state.evaluations[currentTask.id]=scoreEvaluation(currentTask,work,run);state.activity.unshift("Submitted "+currentTask.title+" for evaluation");state.activity=state.activity.slice(0,30);saveState();showEvaluation();}catch(err){alert("Evaluation failed: "+err.message);}finally{if(b){b.disabled=false;b.textContent="Submit for AI Evaluation";}}},350);}
function askGuide(){
 const input=document.getElementById("chatq"),q=input.value.trim();if(!q)return;
 const chat=document.getElementById("chat");
 chat.innerHTML+=`<div class="msg me">${escapeHtml(q)}</div>`;
 const a=guide(q,currentTask,chat.querySelectorAll(".me").length);
 chat.innerHTML+=`<div class="msg ai">${a}</div>`;
 input.value="";chat.scrollTop=chat.scrollHeight;
}
function guide(q,t,count){
 const x=q.toLowerCase();
 if(/error|wrong|fail|not work|bug|exception/.test(x))return `Let's debug <b>${t.title}</b> step by step. First isolate the exact step that fails. What input did you use, what output did you get, and what did you expect?`;
 if(/data|dataset|column|row|missing|duplicate|clean/.test(x)&&(/data|python|excel|sql|power bi/.test((t.subject+" "+t.type).toLowerCase())))return `For this ${t.skill} task, inspect the evidence before changing it. Look for missing values, duplicates, inconsistent formats or unusual records. Which issue did you identify first?`;
 if(/formula|calculate|calculation|equation|math|value|percentage/.test(x))return `Before calculating, write down the known values, the formula or method you plan to use, and the unit of the result. What part of your calculation are you least confident about?`;
 if(/graph|chart|visual|dashboard/.test(x))return `For the ${t.type} workspace, first decide what comparison or pattern the visual should communicate. What question should your chart answer?`;
 if(/why|explain|concept|meaning/.test(x))return `For ${t.skill}, explain the concept in your own words and then connect it to one piece of evidence from your work. If you can make that connection, your reasoning is easier to verify.`;
 if(/next|start|begin|first step|what should/.test(x))return `For <b>${t.title}</b>, start with: understand the evidence → choose a method → perform the work → check the result. Which step are you currently on?`;
 if(/alternative|another|different|other way/.test(x))return `There may be more than one valid approach. Compare the assumptions, expected output and trade-offs of the alternatives before choosing one.`;
 if(/check|verify|validate|correct/.test(x))return `To verify your result, use an independent check: recalculate, test an edge case, compare with an expected pattern, or explain why the result makes sense. Which check fits your task?`;
 if(/stuck|confused|help/.test(x))return `Let's narrow it down. Tell me the exact step you completed, the point where you got stuck, and what you expected to happen. I can guide the next investigation without doing it for you.`;
 const variants=[
  `I can help with <b>${t.title}</b>. Show me the part you have already attempted, and I'll help you identify the next step.`,
  `For this ${t.type} task, I would first inspect your current evidence and reasoning. What have you completed so far?`,
  `Let's keep the task yours: tell me your current approach and one result you observed. I'll ask a guiding question from there.`
 ];
 return variants[(count-1)%variants.length];
}

function evalrow(a,b){return `<div class="evalrow"><b>${a}</b><span class="${b==="Strong"||b==="Ready"?"good":"warn"}">${b}</span></div>`}
function showEvaluation(){const t=currentTask,e=state.evaluations[t.id];if(!e){alert("No evaluation found for this task.");return;}const u=state.understanding[t.id];modal(`<button class="close" onclick="closeModal()">×</button><span class="tag green">Evaluation Complete</span><h2>${escapeHtml(t.title)}</h2><p class="muted">Work evidence and task-specific checks have been recorded.</p><div class="notice" style="margin:14px 0"><div style="font-size:34px;font-weight:800">${e.score}%</div><div class="muted small">Demonstration progress</div><div class="progress" style="margin-top:10px"><i style="width:${e.score}%"></i></div></div>${evalrow("Correctness",e.correct)}${evalrow("Approach",e.approach)}${evalrow("Problem Solving",e.problem)}${evalrow("Task Completion",e.completion)}${u?`<div class="notice" style="margin-top:12px"><b>Understanding:</b> ${u.score}%</div>`:""}<div class="btnrow" style="margin-top:14px"><button class="secondary" onclick="closeModal()">Close</button><button class="primary" onclick="showUnderstanding()">${u?"Review Understanding Check":"Start Understanding Check"}</button></div>`);}
function showUnderstanding(){const t=currentTask,u=state.understanding[t.id];const qs=[`Why did you choose your current approach for "${t.title}"?`,`What would you change if one important input or condition changed?`,`How would you verify that your final result is reliable?`];modal(`<button class="close" onclick="closeModal()">×</button><h2>Understanding Check</h2><p class="muted">Explain your own work. This becomes part of the proof evidence.</p>${qs.map((q,i)=>`<div class="field"><label>${i+1}. ${q}</label><textarea id="uq${i}" placeholder="Explain in your own words...">${u?escapeHtml(u.answers[i]||""):""}</textarea></div>`).join("")}<button class="primary" onclick="submitUnderstanding()">${u?"Update Answers":"Submit Answers"}</button>`);}
function submitUnderstanding(){const answers=[0,1,2].map(i=>document.getElementById("uq"+i)?.value.trim()||"");if(answers.some(x=>x.length<15)){alert("Please answer all three questions with at least 15 characters each.");return;}const t=currentTask,e=state.evaluations[t.id];const joined=answers.join(" ").toLowerCase();const useful=[t.skill.toLowerCase(),"because","result","check","change","reason","method","evidence"].filter(k=>joined.includes(k)).length;const score=Math.max(50,Math.min(100,60+Math.min(25,Math.floor(joined.length/30))+Math.min(15,useful*2)));state.understanding[t.id]={answers,score,evaluatedAt:new Date().toISOString()};if(e){e.understandingScore=score;e.score=Math.round((e.score||60)*.7+score*.3);}state.activity.unshift("Completed understanding check for "+t.title);state.activity=state.activity.slice(0,30);saveState();modal(`<button class="close" onclick="closeModal()">×</button><h2>Understanding Verified ✓</h2><p>Your explanation has been recorded as evidence.</p><div class="notice"><b>Understanding: ${score}%</b><br>Combined demonstration progress: ${e?e.score:score}%</div><button class="primary" onclick="closeModal();page('proof')">View My Proof</button>`);}
function proofPage(){let done=Object.keys(state.evaluations);return `<button class="back" onclick="historyBack()">← Back</button><h1>My Proof</h1><p class="muted">Evidence of demonstrated ability.</p><div class="grid cards">${(done.length?done.map(id=>{let t=tasks.find(x=>x.id==id);return `<div class="card"><span class="tag green">Evaluated</span><h3>${t.title}</h3><p class="muted small">${t.course} · ${t.skill}</p><div class="progress"><i style="width:${state.evaluations[id].score}%"></i></div><p class="small"><b>${state.evaluations[id].score}% demonstration progress</b></p><button class="secondary" onclick="currentTask=tasks.find(x=>x.id==${id});showEvaluation()">View Evaluation</button></div>`}).join(""):`<div class="card"><h3>No proof records yet</h3><p class="muted">Complete a task and submit it for evaluation.</p></div>`)}</div>`}
function skillsPage(){const map={};Object.entries(state.evaluations||{}).forEach(([id,e])=>{const t=tasks.find(x=>x.id==id);if(t){map[t.skill]=map[t.skill]||[];map[t.skill].push(e.score||0);}});return `<button class="back" onclick="historyBack()">← Back</button><h1>Skills</h1><p class="muted">Your demonstration progress across skills.</p><div class="grid cards" style="margin-top:18px">${Object.entries(map).map(([k,v])=>{const n=Math.round(v.reduce((a,b)=>a+b,0)/v.length);return `<div class="card"><div style="display:flex;justify-content:space-between"><b>${escapeHtml(k)}</b><b>${n}%</b></div><div class="progress" style="margin-top:12px"><i style="width:${n}%"></i></div><p class="small muted">Based on evaluated task evidence.</p></div>`}).join("")||`<div class="card"><h3>No demonstrated skills yet</h3><p class="muted">Complete and evaluate a task to build your proof profile.</p></div>`}</div>`;}
function activityPage(){return `<button class="back" onclick="historyBack()">← Back</button><h1>Activity</h1><div class="card" style="margin-top:18px">${state.activity.map((x,i)=>`<div class="evalrow"><span>${x}</span><span class="muted small">${i+1} · recent</span></div>`).join("")}</div>`}
function profilePage(){const p=state.profile||{};const initials=(p.name||"S").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();return `<button class="back" onclick="historyBack()">← Back</button><h1>Profile</h1><div class="card" style="max-width:700px;margin-top:18px"><div class="avatar" style="width:60px;height:60px;font-size:20px">${escapeHtml(initials)}</div><div class="field"><label>Full name</label><input id="profileName" value="${escapeHtml(p.name||"")}"></div><div class="field"><label>Email</label><input value="${escapeHtml(p.email||currentUser||"")}" disabled></div><div class="field"><label>Course</label><input id="profileCourse" value="${escapeHtml(p.course||"")}"></div><div class="field"><label>Department</label><input id="profileDepartment" value="${escapeHtml(p.department||"")}"></div><div class="field"><label>Bio</label><textarea id="profileBio">${escapeHtml(p.bio||"")}</textarea></div><button class="primary" onclick="saveProfile()">Save Profile</button></div>`;}
function saveProfile(){const name=document.getElementById("profileName").value.trim();if(!name){alert("Name is required.");return;}state.profile={...state.profile,name,email:currentUser,course:document.getElementById("profileCourse").value.trim(),department:document.getElementById("profileDepartment").value.trim(),bio:document.getElementById("profileBio").value.trim()};state.activity.unshift("Updated profile");saveState();alert("Profile saved successfully.");page("profile");}
function skillBar(k,v){return `<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><b>${k}</b><span>${v}%</span></div><div class="progress"><i style="width:${v}%"></i></div></div>`}
function showVersions(){const arr=state.versions[currentTask.id]||[];if(!arr.length){modal(`<button class="close" onclick="closeModal()">×</button><h2>Work Versions</h2><p class="muted">No saved versions yet. Start editing and SkillProof will create snapshots automatically.</p>`);return;}modal(`<button class="close" onclick="closeModal()">×</button><h2>Work Versions</h2><p class="muted">Last ${arr.length} saved snapshots.</p>${arr.slice().reverse().map((v,i)=>`<div class="notice" style="margin-top:8px"><b>Version ${arr.length-i}</b><br><span class="small muted">${new Date(v.savedAt).toLocaleString()}</span><br><div style="margin-top:6px;white-space:pre-wrap;max-height:120px;overflow:auto">${escapeHtml(v.snapshot.slice(0,1200))}${v.snapshot.length>1200?"…":""}</div></div>`).join("")}`);}
function modal(x){document.getElementById("modalBody").innerHTML=x;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
page("dashboard");
</script>
